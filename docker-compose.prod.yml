# KANYR Docker Compose Configuration
# Production environment setup

version: '3.8'

services:
  # Backend Service - Node.js/Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kanyr-backend:latest
    container_name: kanyr-backend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    volumes:
      # SQLite database persistence - only database data persists
      - kanyr-db-data:/app/config
    networks:
      - kanyr-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Service - Vue.js with nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kanyr-frontend:latest
    container_name: kanyr-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kanyr-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes for data persistence
volumes:
  kanyr-db-data:
    driver: local
    name: kanyr-sqlite-data-prod

# Network configuration
networks:
  kanyr-network:
    driver: bridge
    name: kanyr-network-prod