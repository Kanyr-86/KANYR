<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/Kanyr.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KANYR - Kollégiumi Nyilvántartó Rendszer - Hallgatói és szoba kezelő alkalmazás" />
    <meta name="theme-color" content="#0d6efd" />
    
    <!-- Preconnect to API and external resources -->
    <link rel="preconnect" href="http://localhost:3000" crossorigin />
    <link rel="dns-prefetch" href="http://localhost:3000" />
    
    <!-- Preload critical fonts (if using custom fonts) -->
    <!-- <link rel="preload" href="/fonts/your-font.woff2" as="font" type="font/woff2" crossorigin /> -->
    
    <title>KANYR - Kollégiumi Nyilvántartó Rendszer</title>
    
    <!-- CRITICAL CSS - Inline for fastest initial render -->
    <!-- This is the minimal CSS needed for above-the-fold content -->
    <style>
      /* Critical CSS Reset */
      *,*::before,*::after{box-sizing:border-box}
      html{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
      body{margin:0;font-size:1rem;font-weight:400;line-height:1.5;color:#212529;background-color:#fff}
      
      /* Critical Layout */
      .container{width:100%;padding-right:0.75rem;padding-left:0.75rem;margin-right:auto;margin-left:auto}
      @media(min-width:576px){.container{max-width:540px}}
      @media(min-width:768px){.container{max-width:720px}}
      @media(min-width:992px){.container{max-width:960px}}
      @media(min-width:1200px){.container{max-width:1140px}}
      .row{display:flex;flex-wrap:wrap;margin-right:-0.75rem;margin-left:-0.75rem}
      .col-12{flex:0 0 auto;width:100%;padding-right:0.75rem;padding-left:0.75rem}
      
      /* Critical Typography */
      h1,h2,h3{margin-top:0;margin-bottom:0.5rem;font-weight:500;line-height:1.2}
      h1{font-size:calc(1.375rem + 1.5vw)}h2{font-size:calc(1.325rem + 0.9vw)}h3{font-size:calc(1.3rem + 0.6vw)}
      @media(min-width:1200px){h1{font-size:2.5rem}h2{font-size:2rem}h3{font-size:1.75rem}}
      p{margin-top:0;margin-bottom:1rem}
      a{color:#0d6efd;text-decoration:underline}
      
      /* Critical Utilities */
      .d-flex{display:flex!important}.d-block{display:block!important}.d-none{display:none!important}
      @media(min-width:768px){.d-md-flex{display:flex!important}.d-md-block{display:block!important}.d-md-none{display:none!important}}
      .flex-row{flex-direction:row!important}.flex-column{flex-direction:column!important}
      .justify-content-center{justify-content:center!important}.justify-content-between{justify-content:space-between!important}
      .align-items-center{align-items:center!important}.flex-grow-1{flex-grow:1!important}
      .m-0{margin:0!important}.mx-auto{margin-right:auto!important;margin-left:auto!important}
      .mt-0{margin-top:0!important}.mb-0{margin-bottom:0!important}
      .p-3{padding:1rem!important}.p-4{padding:1.5rem!important}
      .px-3{padding-right:1rem!important;padding-left:1rem!important}
      .py-3{padding-top:1rem!important;padding-bottom:1rem!important}
      .text-center{text-align:center!important}.text-start{text-align:left!important}
      .text-primary{color:#0d6efd!important}.text-secondary{color:#6c757d!important}
      .text-danger{color:#dc3545!important}.text-white{color:#fff!important}
      .fw-bold{font-weight:700!important}.fs-5{font-size:1.25rem!important}
      .bg-light{background-color:#f8f9fa!important}.bg-white{background-color:#fff!important}
      .w-100{width:100%!important}.h-100{height:100%!important}.min-vh-100{min-height:100vh!important}
      .position-relative{position:relative!important}.position-absolute{position:absolute!important}
      
      /* Critical Buttons */
      .btn{display:inline-block;padding:0.375rem 0.75rem;font-size:1rem;font-weight:400;line-height:1.5;text-align:center;text-decoration:none;vertical-align:middle;cursor:pointer;user-select:none;border:1px solid transparent;border-radius:0.375rem;background-color:transparent;transition:color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out}
      .btn-primary{color:#fff;background-color:#0d6efd;border-color:#0d6efd}
      .btn-primary:hover{color:#fff;background-color:#0b5ed7;border-color:#0a58ca}
      .btn-secondary{color:#fff;background-color:#6c757d;border-color:#6c757d}
      .btn-outline-primary{color:#0d6efd;border-color:#0d6efd}
      .btn-lg{padding:0.5rem 1rem;font-size:1.25rem;border-radius:0.5rem}
      .btn-sm{padding:0.25rem 0.5rem;font-size:0.875rem;border-radius:0.25rem}
      
      /* Critical Card */
      .card{position:relative;display:flex;flex-direction:column;min-width:0;word-wrap:break-word;background-color:#fff;background-clip:border-box;border:1px solid rgba(0,0,0,.125);border-radius:0.375rem}
      .card-body{flex:1 1 auto;padding:1rem}
      
      /* Critical Loading Spinner */
      .spinner-border{display:inline-block;width:2rem;height:2rem;vertical-align:-0.125em;border:0.25em solid currentColor;border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
      @keyframes spinner-border{to{transform:rotate(360deg)}}
      
      /* App Layout */
      .app-layout{display:flex;min-height:100vh}
      .sidebar{position:fixed;top:0;left:0;width:250px;height:100vh;background-color:#212529;z-index:1000}
      .main-content{flex:1;margin-left:250px;min-height:100vh}
      @media(max-width:991.98px){.sidebar{transform:translateX(-100%)}.sidebar.show{transform:translateX(0)}.main-content{margin-left:0}}
      
      /* Navbar */
      .navbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:0.5rem 1rem;background-color:#fff;border-bottom:1px solid #dee2e6}
      
      /* Form Control */
      .form-control{display:block;width:100%;padding:0.375rem 0.75rem;font-size:1rem;font-weight:400;line-height:1.5;color:#212529;background-color:#fff;background-clip:padding-box;border:1px solid #ced4da;border-radius:0.375rem;transition:border-color .15s ease-in-out,box-shadow .15s ease-in-out}
      .form-control:focus{color:#212529;background-color:#fff;border-color:#86b7fe;outline:0;box-shadow:0 0 0 0.25rem rgba(13,110,253,.25)}
      
      /* Reduced Motion */
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
      
      /* Initial Loading State */
      #app:empty::before{content:'';display:block;width:40px;height:40px;margin:100px auto;border:4px solid #f3f3f3;border-top:4px solid #0d6efd;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    </style>
    
    <!-- Non-critical CSS will be loaded by the build process -->
    <!-- The critical CSS above is sufficient for initial render -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
